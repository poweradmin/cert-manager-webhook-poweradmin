---
name: Helm

on:
  push:
    paths:
      - "deploy/**"
  pull_request:
    branches:
      - main
    paths:
      - "deploy/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Lint chart
        run: helm lint deploy/cert-manager-webhook-poweradmin

      - name: Template chart
        run: |
          chart=deploy/cert-manager-webhook-poweradmin
          helm template test "$chart" --set groupName=acme.example.com
          helm template test "$chart" --set service.port=8443
          helm template test "$chart" \
            --set 'rbac.secretReader.additionalNamespaces={team-a,team-b}' \
            --set 'rbac.secretReader.secretNames={poweradmin-api-key}'
          helm template test "$chart" --set rbac.secretReader.clusterScope=true
