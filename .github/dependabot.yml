version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00"
      timezone: "Europe/Vilnius"
    # Wait until a release has been public for 3 days before opening a PR,
    # to reduce exposure to compromised/yanked supply-chain releases.
    cooldown:
      default-days: 3
    # The k8s.io/* and sigs.k8s.io/* families release in lockstep on a shared
    # version line, so one PR per module is pure noise — batch them together.
    # Other deps stay ungrouped to keep their own changelog entries.
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
    # "deps:" type routes commits into release-please's Dependency Updates
    # changelog section; "chore(deps):" would be hidden as type chore.
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "12:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 3
    # codeql-action init/autobuild/analyze must move in lockstep —
    # mixed versions fail with a config-version mismatch. Kept as its own group
    # (and excluded below) so a broad match can never split the trio apart.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
    # "ci" type is hidden in release-please config — action bumps are CI
    # plumbing, not user-facing; gomod/docker bumps stay in the changelog.
    commit-message:
      prefix: "ci"
  - package-ecosystem: "docker"
    directory: "/"
    # Go ships release candidates as a new minor (1.27rc2 before 1.27.0) and
    # Dependabot fails to detect those tags as pre-releases, so block minor
    # bumps for golang and move the build image to a new Go minor by hand.
    ignore:
      - dependency-name: "golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "13:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 3
    # Only the golang and alpine base images live here; they are always
    # reviewed together, so a single PR is easier than two.
    groups:
      base-images:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
